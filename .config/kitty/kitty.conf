font_family JetBrainsMono Nerd Font 
font_size 12
# background_opacity 2
dynamic_background_opacity  yes
confirm_os_window_close -1
enable_audio_bell no
mouse_hide_wait 2.0
window_padding_width 4
include colors-matugen.conf
shell_integration enabled
allow_remote_control yes
selection_foreground        none
selection_background        none
# map ctrl+f launch --type=os-window --cwd=current ~/.config/kitty/tab-search.sh
map ctrl+f launch --type=overlay --os-window-class=floating-script ~/.config/kitty/tab-search.sh
map ctrl+shift+t combine : new_tab : sleep 0.01 : set_tab_title
map ctrl+p launch --type=overlay --os-window-class=floating-script ~/.config/kitty/project_picker.sh
# map ctrl+p launch --type=background kitty --class="kitty-picker" ~/.config/kitty/project_picker.sh
# map ctrl+shift+t combine : new_tab : set_tab_title
# use this to refresh the config
# ctrl + shift + f5

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 0
