customCommands:
  - key: "<c-g>"
    description: "Generate commit message with Gemini"
    context: "files"
    prompts:
      - type: "input"
        title: "Gemini Commit Message"
        key: "Msg"
        initialValue: '{{runCommand "/home/meng/scripts/gemini-commit.sh"}}'
    command: 'git commit -m "{{.Form.Msg}}"'
  # Each worktree runs in its own Neovim / kitty tab; the current one stays open
  - key: "o"
    description: "Open worktree in its own kitty tab (Neovim)"
    context: "worktrees"
    command: "~/.config/lazygit/worktree-open.sh {{.SelectedWorktree.Path | quote}}"
    output: "none"
os:
  # The nvim-remote preset suspends lazygit only when it is NOT running inside
  # Neovim ($NVIM unset), so standalone lazygit hands the terminal to nvim and
  # lazygit inside <leader>gg stays non-blocking. The commands themselves go
  # through nvim-open.sh, which talks to the parent Neovim via `nvim --server`.
  editPreset: "nvim-remote"
  edit: "~/.config/lazygit/nvim-open.sh {{filename}}"
  editAtLine: "~/.config/lazygit/nvim-open.sh {{filename}} {{line}}"
  editAtLineAndWait: "nvim +{{line}} -- {{filename}}"
  openDirInEditor: "~/.config/lazygit/nvim-open.sh {{dir}}"
gui:
  nerdFontsVersion: "3"
  border: "rounded"
  showFileIcons: true
  showBottomLine: true
  showCommandLog: false
  showRandomTip: false
  sidePanelWidth: 0.3
  expandFocusedSidePanel: true
  mainPanelSplitMode: "flexible"
  # Tokyo Night (night) — matches the Neovim colorscheme
  theme:
    activeBorderColor:
      - "#ff9e64"
      - bold
    inactiveBorderColor:
      - "#3b4261"
    searchingActiveBorderColor:
      - "#e0af68"
      - bold
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    inactiveViewSelectedLineBgColor:
      - "#292e42"
    cherryPickedCommitFgColor:
      - "#1a1b26"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#1a1b26"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#f7768e"
    defaultFgColor:
      - "#c0caf5"
    authorColors:
      "*": "#7dcfff"
    branchColorPatterns:
      "^main$": "#9ece6a"
      "^master$": "#9ece6a"
git:
  # Diffs rendered by delta with true-color backgrounds (see delta.gitconfig)
  diffRenderers:
    - colorArg: always
      command: delta --config /home/meng/.config/lazygit/delta.gitconfig --paging=never
  log:
    showGraph: "always"
